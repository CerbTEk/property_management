name: Android TV pilot APK
on:
  push:
    branches: [main]
    paths: ['android-tv/**', '.github/workflows/android-tv.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build pilot APK
        working-directory: android-tv
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: treestand-tv-pilot-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
